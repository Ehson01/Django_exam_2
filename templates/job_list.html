{% extends 'base.html' %}

{% block title %}Вакансии{% endblock %}

{% block content %}
<div class="page-head">
    <div>
        <h1>Вакансии</h1>
        <p class="subtitle">Найдено: {{ jobs|length }}</p>
    </div>
    <a class="btn" href="{% url 'job_create' %}">+ Добавить вакансию</a>
</div>

<form method="get" class="card">
    <div class="filters">
        <div>
            <label for="q">Название</label>
            <input type="text" id="q" name="q" value="{{ query }}" placeholder="Например: Django">
        </div>
        <div>
            <label for="category">Категория</label>
            <select id="category" name="category">
                <option value="">Все</option>
                {% for category in categories %}
                    <option value="{{ category.id }}" {% if category_id == category.id|stringformat:"s" %}selected{% endif %}>{{ category.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="company">Компания</label>
            <select id="company" name="company">
                <option value="">Все</option>
                {% for company in companies %}
                    <option value="{{ company.id }}" {% if company_id == company.id|stringformat:"s" %}selected{% endif %}>{{ company.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="min_salary">Зарплата от</label>
            <input type="number" id="min_salary" name="min_salary" min="0" value="{{ min_salary }}">
        </div>
        <div class="btn-group">
            <button type="submit" class="btn">Найти</button>
            <a class="btn btn-outline" href="{% url 'job_list' %}">Сбросить</a>
        </div>
    </div>
</form>

{% for job in jobs %}
    {% include 'job_card.html' %}
{% empty %}
    <div class="card empty">По вашему запросу вакансий не найдено.</div>
{% endfor %}
{% endblock %}
