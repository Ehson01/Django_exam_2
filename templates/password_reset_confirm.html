{% extends 'base.html' %}

{% block title %}Новый пароль{% endblock %}

{% block content %}
<div class="card form-card">
    <h1>Новый пароль</h1>


    <form method="post">
        {% csrf_token %}
        <label for="new_password1">Новый пароль</label>
        <input type="password" id="new_password1" name="new_password1" required autofocus>

        <label for="new_password2">Повторите пароль</label>
        <input type="password" id="new_password2" name="new_password2" required>

        <div class="form-actions"><button type="submit" class="btn">Сохранить пароль</button></div>
    </form>
</div>
{% endblock %}
