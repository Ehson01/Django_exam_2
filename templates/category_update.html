{% extends 'base.html' %}

{% block title %}Редактирование категории{% endblock %}

{% block content %}
<div class="card form-card">
    <h1>Редактирование категории</h1>
    <form method="post">
        {% csrf_token %}
        <label for="name">Название *</label>
        <input type="text" id="name" name="name" maxlength="100" value="{{ category.name }}" required autofocus>
        <div class="form-actions">
            <button type="submit" class="btn">Сохранить</button>
            <a class="btn btn-outline" href="{% url 'category_list' %}">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
