{% extends 'base.html' %}

{% block title %}Сброс пароля{% endblock %}

{% block content %}
<div class="card form-card">
    <h1>Сброс пароля</h1>
    <p class="subtitle">Укажите email аккаунта — мы отправим ссылку для создания нового пароля.</p>

    <form method="post">
        {% csrf_token %}
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus>

        <div class="form-actions">
            <button type="submit" class="btn">Отправить ссылку</button>
            <a class="btn btn-outline" href="{% url 'login' %}">Назад</a>
        </div>
    </form>
</div>
{% endblock %}
