{% extends 'base.html' %}

{% block title %}Смена пароля{% endblock %}

{% block content %}
<div class="card form-card">
    <h1>Смена пароля</h1>


    <form method="post">
        {% csrf_token %}
        <label for="old_password">Текущий пароль</label>
        <input type="password" id="old_password" name="old_password" required>

        <label for="new_password1">Новый пароль</label>
        <input type="password" id="new_password1" name="new_password1" required>

        <label for="new_password2">Повторите новый пароль</label>
        <input type="password" id="new_password2" name="new_password2" required>

        <div class="form-actions">
            <button type="submit" class="btn">Изменить пароль</button>
            <a class="btn btn-outline" href="{% url 'profile' %}">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
