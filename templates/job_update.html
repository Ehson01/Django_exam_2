{% extends 'base.html' %}

{% block title %}Редактирование: {{ job.title }}{% endblock %}

{% block content %}
<div class="card form-card form-wide">
    <h1>Редактирование вакансии</h1>
    <form method="post">
        {% csrf_token %}
        {% include 'job_fields.html' %}
        <div class="form-actions">
            <button type="submit" class="btn">Сохранить</button>
            <a class="btn btn-outline" href="{% url 'job_detail' job.pk %}">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
